<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141619"/>
      <stop offset="100%" stop-color="#0b0c0e"/>
    </linearGradient>
  </defs>

  <rect width="720" height="260" fill="url(#bg3)"/>

  <!-- menu bar -->
  <rect x="0" y="0" width="720" height="34" fill="#1a1c1f"/>

  <!-- the actual status item: node + dot + speed -->
  <g>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="13" fill="#f2f2f7">
      <text x="596" y="22" text-anchor="end">SG01</text>
    </g>
    <!-- green dot with glow -->
    <g transform="translate(604,17)">
      <circle cx="0" cy="0" r="5.2" fill="#34c759" opacity="0.12"/>
      <circle cx="0" cy="0" r="4" fill="#34c759" opacity="0.2"/>
      <circle cx="0" cy="0" r="3" fill="#34c759" opacity="0.32"/>
      <circle cx="0" cy="0" r="2" fill="#34c759"/>
    </g>
    <g font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#f2f2f7">
      <text x="614" y="22">76</text>
    </g>
    <g font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#9a9ca2">
      <text x="637" y="22">M</text>
    </g>
  </g>

  <!-- big callout of the status item -->
  <g transform="translate(150,138)">
    <rect x="-118" y="-34" width="236" height="68" rx="14" fill="#1d1f23" stroke="#2c2e34" stroke-width="1"/>
    <text x="-88" y="8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="500" fill="#f2f2f7">SG01</text>
    <g transform="translate(-40,-1)">
      <circle cx="0" cy="0" r="7.5" fill="#34c759" opacity="0.12"/>
      <circle cx="0" cy="0" r="5.6" fill="#34c759" opacity="0.2"/>
      <circle cx="0" cy="0" r="4.2" fill="#34c759" opacity="0.32"/>
      <circle cx="0" cy="0" r="2.8" fill="#34c759"/>
    </g>
    <text x="-24" y="8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="600" fill="#f2f2f7">76</text>
    <text x="12" y="8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#8b8d93">M</text>

    <!-- labels under -->
    <text x="-88" y="24" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="9" fill="#5f6167">节点</text>
    <text x="-24" y="24" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="9" fill="#5f6167">网速</text>
  </g>

  <!-- zero-traffic note -->
  <g transform="translate(300,138)">
    <path d="M 0 -20 h 30" stroke="#3a3c42" stroke-width="1.4" stroke-linecap="round"/>
    <g font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#7f8187">
      <text x="40" y="-24">平时只读节点名</text>
      <text x="40" y="-8">零流量 · 点一下才测速</text>
    </g>
  </g>

  <!-- delay color legend -->
  <g transform="translate(300,176)" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="10" fill="#6f7178">
    <circle cx="4" cy="-4" r="3" fill="#34c759"/><text x="14" y="0">&lt;150ms</text>
    <circle cx="64" cy="-4" r="3" fill="#ffd60a"/><text x="74" y="0">150-300</text>
    <circle cx="134" cy="-4" r="3" fill="#ff453a"/><text x="144" y="0">&gt;300ms</text>
  </g>

  <!-- text block -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'PingFang SC', sans-serif">
    <text x="484" y="118" fill="#f5f5f7" font-size="34" font-weight="600" letter-spacing="-0.5">ProxyNodeSpeed</text>
    <text x="484" y="146" fill="#9a9ca2" font-size="15">节点 + 状态 + 网速，一眼看完</text>
    <text x="484" y="170" fill="#5f6167" font-size="13">macOS menu bar · mihomo / Clash</text>
  </g>

  <!-- bottom note -->
  <text x="40" y="236" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#5f6167">仅本机 loopback 通信，不上传任何节点 information 或配置</text>
</svg>
